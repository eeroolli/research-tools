# Alias → Zotero itemType mappings for enrichment and item creation.
# Keys are normalized on load (case-insensitive; spaces/hyphens → underscores).
# Values must be valid Zotero itemType strings (camelCase).
# Ref (COAR): https://vocabularies.coar-repositories.org/resource_types/3.2/

[aliases]
# Zotero passthrough
journalArticle = journalArticle
bookSection = bookSection
conferencePaper = conferencePaper
book = book
preprint = preprint
manuscript = manuscript
report = report
thesis = thesis
newspaperArticle = newspaperArticle
magazineArticle = magazineArticle
webpage = webpage
blogPost = blogPost
presentation = presentation
patent = patent
dataset = dataset
computerProgram = computerProgram
document = document

# Internal snake_case
journal_article = journalArticle
book_chapter = bookSection
conference_paper = conferencePaper
news_article = newspaperArticle
web_article = webpage
working_paper = preprint

# CrossRef / DataCite kebab
journal-article = journalArticle
book-chapter = bookSection
proceedings-article = conferencePaper
posted-content = preprint
report-series = report
book-part = bookSection
edited-book = book
reference-book = book
book-series = book
peer-review = journalArticle
reference-entry = encyclopediaArticle
monograph = book
dissertation = thesis

# CSL (from zotero-schema csl.types)
article-journal = journalArticle
article-magazine = magazineArticle
article-newspaper = newspaperArticle
chapter = bookSection
paper-conference = conferencePaper
post-weblog = blogPost

# Soft / source-specific (generic "article" → journal; JSTOR etc.)
article = journalArticle
review = journalArticle
case_study = journalArticle
meta_analysis = journalArticle
academic_paper = journalArticle

# COAR Resource Types 3.2 (coarse) — English labels + compact harvest tokens
# Not the full 105-term tree; only types that map cleanly to Zotero itemTypes.
journal article = journalArticle
research article = journalArticle
review article = journalArticle
data paper = journalArticle
journal = journalArticle
book part = bookSection
working paper = preprint
bachelor thesis = thesis
master thesis = thesis
doctoral thesis = thesis
research report = report
technical report = report
policy report = report
conference paper = conferencePaper
conference proceedings = conferencePaper
conference presentation = presentation
conference poster = presentation
newspaper article = newspaperArticle
magazine article = magazineArticle
blog post = blogPost
website = webpage
software = computerProgram

# Common info:eu-repo / DSpace-style compact forms
bookPart = bookSection
bachelorThesis = thesis
masterThesis = thesis
doctoralThesis = thesis
workingPaper = preprint

[partial_matches]
# Pairs that score as partial (0.3) in MatchPolicy, not full equivalence.
# Format: left = right (either order accepted on load)
journalArticle = conferencePaper
